# Menna Flow API — Cloudflare Worker + D1.
# Setup steps are in the repository README ("Backend setup").
name = "menna-flow-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[vars]
# Comma-separated list of origins allowed to call the API (the Vercel site and local dev).
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "menna-flow"
# Replace with the id printed by `npx wrangler d1 create menna-flow`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The APP_PASSCODE secret is set with `npx wrangler secret put APP_PASSCODE`
# (and in worker/.dev.vars for local development). It is never committed.
