# Menna Flow API — Cloudflare Worker + D1.
# Setup steps are in the repository README ("Backend setup").
name = "menna-flow-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[vars]
# Comma-separated origins allowed to call the API. A "*" matches any run of characters,
# which covers Vercel preview URLs.
ALLOWED_ORIGINS = "https://menna-gym-plan.vercel.app,https://menna-gym-plan-*.vercel.app,http://localhost:5173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "menna-flow"
database_id = "33031492-4b53-4199-83a7-1badfe2ad9af"
migrations_dir = "migrations"

# The APP_PASSCODE secret is set with `npx wrangler secret put APP_PASSCODE`
# (and in worker/.dev.vars for local development). It is never committed.
